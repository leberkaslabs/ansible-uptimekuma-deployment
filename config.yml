---
# Additional NGINX configuration files
# This section allows you to specify extra Nginx configuration files that will be copied into the container.
# Each file should have a name ending in '.conf', as Nginx will only load files with this extension.
nginx_docker_config:
  - name: uptimekuma.conf
    content: |-
      server {
          listen 443 ssl;
          listen [::]:443 ssl;
          http2 on;

          server_name _;

          ssl_certificate /etc/nginx/ssl/tls.crt;
          ssl_certificate_key /etc/nginx/ssl/tls.key;

          location / {
              proxy_http_version 1.1;
              proxy_pass http://localhost:3001/;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
