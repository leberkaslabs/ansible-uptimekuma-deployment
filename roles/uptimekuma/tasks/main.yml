---
- name: Create Uptime Kuma directory
  ansible.builtin.file:
    path: "{{ uptimekuma_docker_path }}"
    owner: "{{ uptimekuma_docker_owner }}"
    group: "{{ uptimekuma_docker_group }}"
    mode: "0750"
    state: directory

- name: Manage Uptime Kuma Docker Compose configuration
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ uptimekuma_docker_path }}/compose.yaml"
    owner: "{{ uptimekuma_docker_owner }}"
    group: "{{ uptimekuma_docker_group }}"
    mode: "0640"
  notify: restart uptimekuma

- name: Manage Uptime Kuma Docker Compose override configuration
  ansible.builtin.copy:
    content: "{{ uptimekuma_docker_override | from_yaml | ansible.builtin.to_nice_yaml(indent=2) }}"
    dest: "{{ uptimekuma_docker_path }}/compose.override.yaml"
    owner: "{{ uptimekuma_docker_owner }}"
    group: "{{ uptimekuma_docker_group }}"
    mode: "0640"
  notify: restart uptimekuma
  when:
    - uptimekuma_docker_override is defined
    - uptimekuma_docker_override | length > 0

- name: Validate Uptime Kuma Docker Compose deployment
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ uptimekuma_docker_path }}"
  changed_when: false

- name: Start Uptime Kuma Docker Compose deployment
  ansible.builtin.command:
    cmd: docker compose --ansi never --progress plain up --detach
    chdir: "{{ uptimekuma_docker_path }}"
  register: uptimekuma
  changed_when: "'Started' in uptimekuma.stdout"
